name: Run Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run test_comprehensive.py
      run: python musicleague_bot/src/tests/test_comprehensive.py
      
    - name: Run test_emoji_voting.py
      run: python musicleague_bot/src/tests/test_emoji_voting.py
      
    - name: Run test_integration.py
      run: python musicleague_bot/src/tests/test_integration.py
      
    - name: Run test_populate_round.py
      run: python musicleague_bot/src/tests/test_populate_round.py
      
    - name: Run test_round_transitions.py
      run: python musicleague_bot/src/tests/test_round_transitions.py
